<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Uptime</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      #game {
        display: block;
        width: 100%;
        height: 100%;
      }

      .landing[hidden] {
        display: none;
      }

      .landing {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        overflow: hidden;
      }

      .landing-bg {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(circle at 50% 20%, rgba(64, 200, 160, 0.16), transparent 55%),
          linear-gradient(180deg, #05080a 0%, #0a1216 60%, #05080a 100%);
      }

      .landing-bg::before {
        content: '';
        position: absolute;
        inset: -10% -10%;
        background-image:
          linear-gradient(rgba(64, 200, 160, 0.08) 1px, transparent 1px),
          linear-gradient(90deg, rgba(64, 200, 160, 0.08) 1px, transparent 1px);
        background-size: 42px 42px;
        animation: landing-grid-drift 18s linear infinite;
        mask-image: radial-gradient(circle at 50% 45%, #000 0%, transparent 75%);
      }

      .landing-bg::after {
        content: '';
        position: absolute;
        inset: 0;
        background-image: repeating-linear-gradient(
          0deg,
          rgba(0, 0, 0, 0.25) 0px,
          rgba(0, 0, 0, 0.25) 1px,
          transparent 1px,
          transparent 3px
        );
        opacity: 0.5;
      }

      @keyframes landing-grid-drift {
        from {
          transform: translate(0, 0);
        }
        to {
          transform: translate(42px, 42px);
        }
      }

      .landing-panel {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 28px;
        padding: 48px 64px;
      }

      .landing-logo {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
      }

      .landing-logo-icon {
        display: flex;
        gap: 10px;
        padding: 14px 20px;
        border: 2px solid rgba(64, 200, 160, 0.5);
        border-radius: 6px;
        background: rgba(64, 200, 160, 0.06);
        box-shadow:
          0 0 24px rgba(64, 200, 160, 0.25),
          inset 0 0 12px rgba(64, 200, 160, 0.1);
      }

      .rack-led {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #3ddc97;
        box-shadow: 0 0 8px #3ddc97;
        animation: landing-led-pulse 1.6s ease-in-out infinite;
      }

      .rack-led:nth-child(2) {
        animation-delay: 0.3s;
      }

      .rack-led:nth-child(3) {
        animation-delay: 0.6s;
      }

      @keyframes landing-led-pulse {
        0%,
        100% {
          opacity: 0.35;
        }
        50% {
          opacity: 1;
        }
      }

      .landing-logo-text {
        font-size: 56px;
        font-weight: 800;
        letter-spacing: 0.12em;
        color: #eafff5;
        text-shadow: 0 0 30px rgba(64, 200, 160, 0.45);
      }

      .landing-tagline {
        margin: 0;
        color: #7fa89a;
        font-size: 15px;
        letter-spacing: 0.04em;
      }

      .landing-start {
        padding: 14px 48px;
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 0.08em;
        color: #05080a;
        background: #3ddc97;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        box-shadow: 0 0 20px rgba(61, 220, 151, 0.4);
        transition:
          transform 0.12s ease,
          box-shadow 0.12s ease;
      }

      .landing-start:hover {
        transform: translateY(-1px);
        box-shadow: 0 0 28px rgba(61, 220, 151, 0.6);
      }

      .landing-start:active {
        transform: translateY(0);
        box-shadow: 0 0 14px rgba(61, 220, 151, 0.4);
      }

      .landing-start:focus-visible {
        outline: 2px solid #eafff5;
        outline-offset: 3px;
      }

      .landing-continue {
        padding: 14px 48px;
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 0.08em;
        color: #eafff5;
        background: transparent;
        border: 2px solid rgba(61, 220, 151, 0.6);
        border-radius: 4px;
        cursor: pointer;
        transition:
          transform 0.12s ease,
          border-color 0.12s ease;
      }

      .landing-continue:hover {
        transform: translateY(-1px);
        border-color: #3ddc97;
      }

      .landing-continue:active {
        transform: translateY(0);
      }

      .landing-continue:focus-visible {
        outline: 2px solid #eafff5;
        outline-offset: 3px;
      }

      .landing-start-stress {
        padding: 8px 24px;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.06em;
        color: #7fa89a;
        background: transparent;
        border: 1px solid rgba(127, 168, 154, 0.4);
        border-radius: 4px;
        cursor: pointer;
        box-shadow: none;
      }

      .landing-start-stress:hover {
        color: #eafff5;
        border-color: rgba(127, 168, 154, 0.8);
      }

      .landing-start-stress:focus-visible {
        outline: 2px solid #eafff5;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <div id="landing"></div>
    <canvas id="game" hidden></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
